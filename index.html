<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="민원인이 원하는 민원 서비스를 빠르게 검색하고 분야별로 필터링할 수 있는 민원 서비스 검색 페이지">
  <title>민원서비스 찾기</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <p class="eyebrow">CIVIL SERVICE SEARCH</p>
      <h1>민원서비스 찾기</h1>
      <p class="subtitle">원하는 민원 서비스를 검색하거나 민원분야를 선택해 빠르게 찾아보세요.</p>
    </div>
  </header>

  <main class="container">
    <section class="search-panel" aria-labelledby="search-title">
      <div class="section-heading">
        <div>
          <h2 id="search-title">민원서비스 검색</h2>
          <p>서비스명과 민원분야를 함께 적용할 수 있습니다.</p>
        </div>
        <button type="button" id="resetButton" class="reset-button">초기화</button>
      </div>

      <div class="filters">
        <div class="field search-field">
          <label for="searchInput">서비스명 검색</label>
          <div class="input-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input
              id="searchInput"
              type="search"
              placeholder="예: 여권, 주민등록, 신고"
              autocomplete="off"
            >
          </div>
        </div>

        <div class="field">
          <label for="categoryFilter">민원분야</label>
          <select id="categoryFilter">
            <option value="all">전체 분야</option>
          </select>
        </div>
      </div>
    </section>

    <section class="result-section" aria-labelledby="result-title">
      <div class="result-summary">
        <div>
          <h2 id="result-title">민원서비스 목록</h2>
          <p id="resultCount" aria-live="polite">총 22건</p>
        </div>
      </div>

      <div id="serviceList" class="service-list" aria-live="polite"></div>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">⌕</div>
        <h3>검색 결과가 없습니다.</h3>
        <p>서비스명 검색어 또는 민원분야를 변경해 보세요.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>민원서비스 검색 · GitHub Pages 배포용 정적 웹페이지</p>
  </footer>
</body>
</html>
